name: "DevSecOps Security-First Pipeline"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  sast:
    name: "1. SAST (Static Analysis)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (Security Linter)
        run: bandit -r backend/app/ -f txt

      - name: Run Semgrep (OWASP Rules)
        uses: semgrep/semgrep-action@v1
        with:
          config: "p/owasp-top-10"

  sca:
    name: "2. SCA (Dependency Security Scan)"
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (Backend Dependencies)
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-311

      - name: Run npm audit (Web Frontend Dependencies)
        run: |
          cd web
          npm audit --audit-level=high

  unit-tests:
    name: "3. Unit & Functional Tests"
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Unit Tests
        run: |
          cd backend
          pytest tests/test_auth.py tests/test_demandes.py

  security-gates:
    name: "4. Security Gates Verification"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Automated Security Gates (ASVS V2/V3/V4/V5/V14)
        run: |
          cd backend
          pytest tests/test_security_gates.py

  dast:
    name: "5. DAST (Dynamic API Security Scan)"
    runs-on: ubuntu-latest
    needs: security-gates
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          format: openapi
          target: "https://e-citoyen-ci-backend.onrender.com/openapi.json"
          fail_action: true

  build:
    name: "6. Production Build"
    runs-on: ubuntu-latest
    needs: dast
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Web Application
        run: |
          cd web
          npm install
          npm run build

  deploy:
    name: "7. Production Deployment"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Cloud (Render / AWS)
        run: |
          echo "[DEPLOY] Tous les security gates sont au vert. Lancement du déploiement en production."
